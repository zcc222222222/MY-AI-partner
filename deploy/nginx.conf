# Host Nginx configuration, installed in /etc/nginx/conf.d/aipartner.conf.
# Replace every example.com and provision its certificate before nginx -t.
# The matching Compose APP_PORT must be 8000 (or update proxy_pass below).
server {
    listen 80;
    server_name example.com;
    return 301 https://example.com$request_uri;
}

server {
    listen 443 ssl;
    server_name example.com;

    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host example.com;
        # This template is for one public-facing proxy, without a CDN/LB ahead.
        # Overwrite user-supplied forwarding headers instead of appending them.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header Connection "";

        # Stream chat tokens immediately and pass client disconnects upstream.
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_ignore_client_abort off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
